name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install
        run: uv sync --extra detect --group dev

      # en_core_web_lg, chosen against the measurement rather than the download size: 97.4
      # percent recall against the small model's 92.6 on 5,355 labelled values, which closes
      # a fifth of the remaining detector misses. 382 MB, cached by setup-uv, about two
      # seconds slower over the whole corpus. SEVER_SPACY_MODEL overrides it.
      - name: Download the spaCy model
        run: uv run python -m spacy download en_core_web_lg

      - name: ruff
        run: uv run ruff check .

      - name: mypy
        run: uv run mypy

      - name: tests
        run: uv run pytest -q

      # The taxonomy is a claim about the law, so the generated page has to agree with the
      # YAML it came from. The test covers this too; running the generator here means a
      # drift shows up as a diff rather than as an assertion message.
      - name: The generated taxonomy page is current
        run: |
          uv run sever taxonomy render
          git diff --exit-code docs/taxonomy.md

      # Redaction is destructive or it is decoration. This runs the real export path and
      # fails the build if any applied box still has recoverable text.
      - name: The PDF leak test, on real exports
        run: uv run sever export --documents 6

      - name: The results table is reproducible
        run: uv run sever report --documents 60 --no-pdf-leak

      # The model row of the published table, from the committed answers rather than from
      # the gateway. `boundary` is a private extra and CI has no key, which is exactly the
      # position a stranger cloning this repository is in. --replay-only makes a cache miss
      # an error, so this step fails if the answers and the corpus ever drift apart.
      - name: The model row replays from the committed answers, with no gateway
        run: >
          uv run sever report --documents 60 --no-pdf-leak
          --model --replay-only --answer-cache results/model-answers.jsonl

      - name: The threshold sweep replays too
        run: uv run sever eval-thresholds --documents 60 --out /tmp/thresholds.md

      # The NL configuration decides two codes differently from the federal one, and the
      # difference is only visible in a rate that did not exist until 2026-09-20. Running
      # it here means a change that quietly re-partitions the denominators shows up as a
      # failing step rather than as a number nobody looked at.
      - name: The same corpus scores under the other statute
        run: uv run sever report --documents 60 --no-pdf-leak --jurisdiction nl --out /tmp/nl

      # The reviewer application is the only place the "a person decides" claim is
      # enforceable, so its endpoint tests are worth naming separately from the suite.
      - name: The release gate
        run: uv run pytest -q tests/test_review_app.py
