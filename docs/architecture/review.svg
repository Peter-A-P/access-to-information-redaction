<svg xmlns="http://www.w3.org/2000/svg" width="1176" height="944" viewBox="0 0 1176 944" role="img" aria-label="The reviewer sees one page at a time with every proposed severance highlighted, withholds, releases or escalates each one or severs text the tool missed, and every action is an append-only hash-chained audit row; a page cannot be completed with a span undecided, a record cannot be released with a page incomplete, and the export applies only what the log says." font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 z" fill="#14201E"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 z" fill="#0E6E60"/></marker><marker id="arrow-signal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 z" fill="#A64C1C"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 z" fill="#5C6B67"/></marker></defs>
<rect width="1176" height="944" fill="#FFFFFF"/>
<text x="28" y="42" font-size="16" font-weight="700" fill="#14201E">The reviewer decides, and the export reads only their decisions</text>
