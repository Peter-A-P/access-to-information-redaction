<text x="588.0" y="481.0" font-size="13" font-weight="500" text-anchor="middle" fill="#14201E">refused while any span is undecided</text>
<text x="588.0" y="498.0" font-size="11" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" text-anchor="middle" fill="#5C6B67">tests/test_review_app.py</text>
<rect x="448.0" y="570.0" width="280.0" height="64.0" rx="4" fill="#FFFFFF" stroke="#0E6E60" stroke-width="1.6"/>
