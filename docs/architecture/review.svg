<text x="588.0" y="607.0" font-size="13" font-weight="500" text-anchor="middle" fill="#14201E">raises while any page is incomplete</text>
<text x="588.0" y="624.0" font-size="11" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" text-anchor="middle" fill="#5C6B67">sever.review.session</text>
