<text x="588.0" y="717.0" font-size="13" font-weight="500" text-anchor="middle" fill="#14201E">sever export --audit</text>
<text x="588.0" y="733.0" font-size="13" font-weight="500" text-anchor="middle" fill="#14201E">applies the decisions, not the proposals</text>
<text x="588.0" y="750.0" font-size="11" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" text-anchor="middle" fill="#5C6B67">sever.review.export</text>
<text x="1008.0" y="724.0" font-size="13" font-weight="400" text-anchor="middle" fill="#5C6B67" font-style="italic">Without --audit: the same PDFs,</text>
<text x="1008.0" y="740.0" font-size="13" font-weight="400" text-anchor="middle" fill="#5C6B67" font-style="italic">named -proposed, not a release</text>
<rect x="448.0" y="822.0" width="280.0" height="64.0" rx="4" fill="#FFFFFF" stroke="#A64C1C" stroke-width="1.6"/>
<rect x="448.0" y="822.0" width="5" height="64.0" rx="2" fill="#A64C1C"/>
<text x="588.0" y="843.0" font-size="13" font-weight="500" text-anchor="middle" fill="#14201E">True-redaction PDF and the schedule</text>
<text x="588.0" y="859.0" font-size="13" font-weight="500" text-anchor="middle" fill="#14201E">text under every box removed; leak test</text>
<text x="588.0" y="876.0" font-size="11" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" text-anchor="middle" fill="#5C6B67">sever.eval.pdf_leak</text>
