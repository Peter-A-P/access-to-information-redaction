<rect x="448.0" y="66.0" width="280.0" height="64.0" rx="4" fill="#FFFFFF" stroke="#14201E" stroke-width="1.1"/>
<text x="588.0" y="87.0" font-size="13" font-weight="500" text-anchor="middle" fill="#14201E">sever review, on loopback</text>
<text x="588.0" y="103.0" font-size="13" font-weight="500" text-anchor="middle" fill="#14201E">one page at a time, proposals highlighted</text>
<text x="588.0" y="120.0" font-size="11" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" text-anchor="middle" fill="#5C6B67">sever.review.app, no network</text>
<rect x="448.0" y="191.0" width="280.0" height="66.0" rx="33.0" fill="#F2F4F3" stroke="#14201E" stroke-width="1.1"/>
<text x="588.0" y="212.0" font-size="13" font-weight="500" text-anchor="middle" fill="#14201E">The reviewer</text>
<text x="588.0" y="228.0" font-size="13" font-weight="500" text-anchor="middle" fill="#14201E">W withhold, R release, E escalate;</text>
<text x="588.0" y="244.0" font-size="13" font-weight="500" text-anchor="middle" fill="#14201E">or select text the tool missed</text>
<rect x="868.0" y="192.0" width="280.0" height="64.0" rx="4" fill="#FFFFFF" stroke="#14201E" stroke-width="1.1"/>
<text x="1008.0" y="220.0" font-size="13" font-weight="500" text-anchor="middle" fill="#14201E">Release everything still undecided</text>
<text x="1008.0" y="236.0" font-size="13" font-weight="500" text-anchor="middle" fill="#14201E">asks first; names the tool&#x27;s withholds</text>
<path d="M 448.0 320.0 a 140.0 7 0 0 1 280.0 0 L 728.0 380.0 a 140.0 7 0 0 1 -280.0 0 Z" fill="#FFFFFF" stroke="#0E6E60" stroke-width="1.6"/><path d="M 448.0 320.0 a 140.0 7 0 0 0 280.0 0" fill="none" stroke="#0E6E60" stroke-width="1.6"/>
<text x="588.0" y="343.0" font-size="13" font-weight="500" text-anchor="middle" fill="#14201E">An audit row, append-only</text>
<text x="588.0" y="359.0" font-size="13" font-weight="500" text-anchor="middle" fill="#14201E">hash-chained; hashes of text, never text</text>
<text x="588.0" y="376.0" font-size="11" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" text-anchor="middle" fill="#5C6B67">sever.review.audit</text>
<text x="168.0" y="346.0" font-size="13" font-weight="400" text-anchor="middle" fill="#5C6B67" font-style="italic">A change of mind is a second row</text>
<text x="168.0" y="362.0" font-size="13" font-weight="400" text-anchor="middle" fill="#5C6B67" font-style="italic">the screen shows the latest, the log keeps both</text>
