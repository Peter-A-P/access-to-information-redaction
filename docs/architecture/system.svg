<svg xmlns="http://www.w3.org/2000/svg" width="1226" height="758" viewBox="0 0 1226 758" role="img" aria-label="Documents are ingested with their layout, a detector finds candidate spans, a context record is built for each, deterministic rules decide the clear cases in a fixed order and a model on placeholders decides the rest or escalates; a reviewer approves page by page into an append-only audit log from which the true-redaction export and the schedule are generated, and the evaluation scores every proposal against labels." font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
