<text x="168.0" y="488.0" font-size="13" font-weight="400" text-anchor="middle" fill="#5C6B67" font-style="italic">because nothing matched</text>
<rect x="448.0" y="696.0" width="280.0" height="64.0" rx="4" fill="#FFFFFF" stroke="#14201E" stroke-width="1.1"/>
<text x="588.0" y="725.0" font-size="13" font-weight="500" text-anchor="middle" fill="#14201E">Above the measured threshold?</text>
<text x="588.0" y="742.0" font-size="11" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" text-anchor="middle" fill="#5C6B67">results/thresholds.md</text>
