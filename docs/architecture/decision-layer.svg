<text x="1008.0" y="595.0" font-size="13" font-weight="500" text-anchor="middle" fill="#14201E">The gateway ledger</text>
<text x="1008.0" y="611.0" font-size="13" font-weight="500" text-anchor="middle" fill="#14201E">every row carries class personal</text>
<text x="1008.0" y="628.0" font-size="11" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" text-anchor="middle" fill="#5C6B67">boundary, project 04</text>
