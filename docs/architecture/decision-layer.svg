<svg xmlns="http://www.w3.org/2000/svg" width="1176" height="944" viewBox="0 0 1176 944" role="img" aria-label="A candidate span gets a context record, the deterministic rules decide the clear cases in a fixed order, whatever is left goes to a model that sees typed placeholders and never a name, and an answer below the measured confidence threshold is escalated with the model&#x27;s reasoning; there is no rule that releases a span because nothing matched." font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
