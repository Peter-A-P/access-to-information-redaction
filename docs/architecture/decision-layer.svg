<rect x="448.0" y="66.0" width="280.0" height="64.0" rx="4" fill="#FFFFFF" stroke="#14201E" stroke-width="1.1"/>
<text x="588.0" y="87.0" font-size="13" font-weight="500" text-anchor="middle" fill="#14201E">A candidate span</text>
<text x="588.0" y="103.0" font-size="13" font-weight="500" text-anchor="middle" fill="#14201E">found by the detector</text>
<text x="588.0" y="120.0" font-size="11" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" text-anchor="middle" fill="#5C6B67">sever.detect</text>
<rect x="448.0" y="184.0" width="280.0" height="80.0" rx="4" fill="#FFFFFF" stroke="#0E6E60" stroke-width="1.6"/>
<rect x="448.0" y="184.0" width="5" height="80.0" rx="2" fill="#0E6E60"/>
<text x="588.0" y="205.0" font-size="13" font-weight="500" text-anchor="middle" fill="#14201E">Its context record</text>
<text x="588.0" y="221.0" font-size="13" font-weight="500" text-anchor="middle" fill="#14201E">block, sentence, heading, title pairing,</text>
<text x="588.0" y="237.0" font-size="13" font-weight="500" text-anchor="middle" fill="#14201E">register, letterhead, coref, requester</text>
<text x="588.0" y="254.0" font-size="11" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" text-anchor="middle" fill="#5C6B67">sever.context</text>
