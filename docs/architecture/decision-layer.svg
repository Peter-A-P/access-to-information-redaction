<rect x="448.0" y="570.0" width="5" height="64.0" rx="2" fill="#0E6E60"/>
<text x="588.0" y="591.0" font-size="13" font-weight="500" text-anchor="middle" fill="#14201E">The model, on typed placeholders</text>
<text x="588.0" y="607.0" font-size="13" font-weight="500" text-anchor="middle" fill="#14201E">never a name; data class personal</text>
<text x="588.0" y="624.0" font-size="11" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" text-anchor="middle" fill="#5C6B67">sever.decide.model, placeholders</text>
