<rect x="448.0" y="310.0" width="5" height="80.0" rx="2" fill="#0E6E60"/>
<text x="588.0" y="331.0" font-size="13" font-weight="500" text-anchor="middle" fill="#14201E">Rules, in a fixed order</text>
<text x="588.0" y="347.0" font-size="13" font-weight="500" text-anchor="middle" fill="#14201E">requester, sensitive ids, non-personal</text>
<text x="588.0" y="363.0" font-size="13" font-weight="500" text-anchor="middle" fill="#14201E">types, capacity, register, twenty years</text>
<text x="588.0" y="380.0" font-size="11" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" text-anchor="middle" fill="#5C6B67">sever.decide.rules</text>
