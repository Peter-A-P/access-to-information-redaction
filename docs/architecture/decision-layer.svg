<text x="588.0" y="843.0" font-size="13" font-weight="500" text-anchor="middle" fill="#14201E">A proposal with its exemption code</text>
<text x="588.0" y="859.0" font-size="13" font-weight="500" text-anchor="middle" fill="#14201E">withhold, release, escalate or flag only</text>
<text x="588.0" y="876.0" font-size="11" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" text-anchor="middle" fill="#5C6B67">sever.decide.pipeline</text>
