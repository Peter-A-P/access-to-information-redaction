# The demonstration beside project 04 on the shared host. It joins 04's compose network
# so 04's Caddy can reach it by name, and publishes no port of its own: Docker's published
# ports bypass the host firewall, and nothing but Caddy needs to reach this.
services:
  redaction:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: sever-demo:latest
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=256m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 2g
    cpus: 1.0
    networks: [boundary]

networks:
  boundary:
    external: true
    name: boundary_default
